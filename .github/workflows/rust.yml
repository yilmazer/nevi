name: Build Nevi

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm64:
    name: Build & Test on macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ARM64 runner architecture
        run: uname -m

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Run render frame-budget guard
        run: cargo test render_frame_budget -- --ignored --nocapture

      - name: Run perf budget guards
        run: cargo test -- --ignored --nocapture grep_index_budget finder_filter_budget method_motion_collect_budget

      # Its own step: it times searches against each other, so it shouldn't
      # share the machine with other tests.
      - name: Run live grep budget guard
        run: cargo test live_grep_budget -- --ignored --nocapture

      - name: Install pinned Neovim for parity smoke test
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.3

      - name: Report Neovim oracle version
        run: nvim --version

      - name: Run Vim oracle smoke test
        run: NEVI_VIM_ORACLE=1 cargo test vim_oracle_smoke -- --ignored --nocapture

      - name: Build release binary
        run: cargo build --release --quiet

      - name: Report release binary size
        run: du -sh target/release/nevi

      - name: Upload macOS ARM64 binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: nevi-macos-arm64
          path: target/release/nevi
          if-no-files-found: error
